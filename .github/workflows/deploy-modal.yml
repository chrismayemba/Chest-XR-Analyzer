name: Deploy private BLIP API to Modal

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      BLIP_API_TOKEN: ${{ secrets.BLIP_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "Missing MODAL_TOKEN_ID"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "Missing MODAL_TOKEN_SECRET"; exit 1; }
          test -n "$BLIP_API_TOKEN" || { echo "Missing BLIP_API_TOKEN"; exit 1; }

      - name: Install Modal
        run: pip install "modal>=1,<2"

      - name: Create API secret and deploy
        run: |
          modal secret create chest-xray-blip-api-auth \
            BLIP_API_TOKEN="$BLIP_API_TOKEN" \
            --force
          modal deploy modal_app.py
